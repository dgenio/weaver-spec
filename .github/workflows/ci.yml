name: CI

on:
  push:
    branches: ["main", "copilot/**"]
  pull_request:
    branches: ["main"]

jobs:
  validate-schemas:
    name: Validate JSON Schemas
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate schema required fields
        run: python scripts/check_schema_fields.py

      - name: Validate sample payloads are valid JSON
        run: |
          python -c "
          import json, glob, sys
          files = glob.glob('examples/sample_payloads/*.json')
          if not files:
              print('ERROR: No sample payload files found', file=sys.stderr)
              sys.exit(1)
          for f in sorted(files):
              with open(f) as fh:
                  json.load(fh)
              print(f'OK: {f}')
          print(f'Validated {len(files)} payload(s)')
          "

  validate-compatibility:
    name: Validate Compatibility Manifest
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Validate compatibility.yaml structure and matrix consistency
        run: |
          python << 'PYEOF'
          import re
          import sys
          from pathlib import Path

          import yaml

          ALLOWED_STATUS = {"verified", "provisional", "unverified", "incompatible"}
          SEMVER = re.compile(r"^\d+\.\d+\.\d+$")
          REQUIRED_KEYS = {
              "name",
              "role",
              "status",
              "supported_spec_versions",
              "tested_version",
              "declaration",
              "known_limitations",
          }

          errors: list[str] = []
          manifest = yaml.safe_load(Path("compatibility.yaml").read_text(encoding="utf-8"))

          if not isinstance(manifest, dict):
              print("FAIL: compatibility.yaml must be a mapping", file=sys.stderr)
              sys.exit(1)

          if manifest.get("schema_version") != 1:
              errors.append("schema_version must be 1")

          versions = manifest.get("contract_versions")
          if not isinstance(versions, list) or not versions:
              errors.append("contract_versions must be a non-empty list")
          else:
              for v in versions:
                  if not isinstance(v, str) or not SEMVER.match(v):
                      errors.append(f"contract_versions entry {v!r} is not MAJOR.MINOR.PATCH")

          valid_contract_versions = (
              {v for v in versions if isinstance(v, str)}
              if isinstance(versions, list)
              else set()
          )

          repos = manifest.get("repositories")
          if not isinstance(repos, list) or not repos:
              errors.append("repositories must be a non-empty list")
              repos = []

          required_repos = {"contextweaver", "agent-kernel", "ChainWeaver"}
          seen = set()
          versioning_md = Path("docs/VERSIONING.md").read_text(encoding="utf-8")

          for i, entry in enumerate(repos):
              where = f"repositories[{i}]"
              if not isinstance(entry, dict):
                  errors.append(f"{where} must be a mapping")
                  continue
              missing = REQUIRED_KEYS - entry.keys()
              if missing:
                  errors.append(f"{where} missing keys: {sorted(missing)}")
              name = entry.get("name")
              if isinstance(name, str):
                  seen.add(name)
                  if name not in versioning_md:
                      errors.append(f"{where}: {name!r} is not referenced in docs/VERSIONING.md")
              status = entry.get("status")
              if status not in ALLOWED_STATUS:
                  errors.append(f"{where}: status {status!r} not in {sorted(ALLOWED_STATUS)}")
              ssv = entry.get("supported_spec_versions")
              if not isinstance(ssv, list):
                  errors.append(f"{where}: supported_spec_versions must be a list")
              else:
                  for v in ssv:
                      if not isinstance(v, str) or not SEMVER.match(v):
                          errors.append(f"{where}: supported_spec_versions entry {v!r} is not semver")
                      elif v not in valid_contract_versions:
                          errors.append(
                              f"{where}: supported_spec_versions entry {v!r} is not one of "
                              f"contract_versions {sorted(valid_contract_versions)}"
                          )
              tested = entry.get("tested_version")
              if tested is not None and (not isinstance(tested, str) or not SEMVER.match(tested)):
                  errors.append(
                      f"{where}: tested_version {tested!r} must be null or MAJOR.MINOR.PATCH"
                  )
              # A claimed status must be backed by a declaration reference and concrete versions.
              if status in {"verified", "provisional"}:
                  if not entry.get("declaration"):
                      errors.append(
                          f"{where}: status {status!r} requires a non-null 'declaration' reference"
                      )
                  if not isinstance(ssv, list) or not ssv:
                      errors.append(
                          f"{where}: status {status!r} requires a non-empty 'supported_spec_versions'"
                      )
                  if tested is None:
                      errors.append(
                          f"{where}: status {status!r} requires a non-null 'tested_version'"
                      )

          for missing_repo in sorted(required_repos - seen):
              errors.append(f"required sibling repository {missing_repo!r} is missing from the manifest")

          if errors:
              for e in errors:
                  print(f"FAIL: {e}", file=sys.stderr)
              sys.exit(1)
          print(f"OK: compatibility.yaml valid — {len(repos)} repositories, status vocabulary and version consistency enforced.")
          PYEOF

  validate-contracts-index:
    name: Validate Contracts Index
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check well-known/contracts.json is up to date
        run: python scripts/generate_contracts_index.py --check

  validate-walkthroughs:
    name: Validate Walkthrough Payloads
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install jsonschema
        run: pip install jsonschema referencing

      - name: Validate inline JSON payloads against schemas
        run: |
          python << 'PYEOF'
          import glob, json, re, sys
          from pathlib import Path
          from jsonschema import Draft202012Validator
          from referencing import Registry, Resource
          from referencing.jsonschema import DRAFT202012

          schemas_by_name = {}
          registry = Registry()
          for p in Path('contracts/json').rglob('*.schema.json'):
              name = p.stem.removesuffix('.schema')
              schema = json.loads(p.read_text(encoding='utf-8'))
              schemas_by_name[name] = schema
              registry = registry.with_resource(
                  uri=schema['$id'],
                  resource=Resource(contents=schema, specification=DRAFT202012),
              )

          fence = chr(96) * 3
          pattern = re.compile(
              r'<!-- schema: (\S+) -->\s*' + fence + r'json\s*(.*?)\s*' + fence,
              re.DOTALL,
          )

          md_files = sorted(
              set(glob.glob('examples/**/*.md', recursive=True))
              | set(glob.glob('docs/**/*.md', recursive=True))
          )

          failures = []
          total = 0
          for f in md_files:
              text = Path(f).read_text(encoding='utf-8')
              for m in pattern.finditer(text):
                  total += 1
                  schema_name, body = m.group(1), m.group(2)
                  if schema_name not in schemas_by_name:
                      failures.append(f'{f}: unknown schema {schema_name!r}')
                      continue
                  try:
                      payload = json.loads(body)
                  except json.JSONDecodeError as e:
                      failures.append(f'{f} ({schema_name}): JSON parse error: {e}')
                      continue
                  v = Draft202012Validator(
                      schemas_by_name[schema_name],
                      registry=registry,
                      format_checker=Draft202012Validator.FORMAT_CHECKER,
                  )
                  for err in sorted(v.iter_errors(payload), key=lambda e: list(e.absolute_path)):
                      path = '/'.join(str(x) for x in err.absolute_path) or '<root>'
                      failures.append(f'{f} ({schema_name}) at {path}: {err.message}')

          print(f'Validated {total} inline payload(s) across {len(md_files)} Markdown file(s).')
          if failures:
              for line in failures:
                  print(f'FAIL: {line}', file=sys.stderr)
              sys.exit(1)
          if total == 0:
              print('FAIL: No <!-- schema: ... --> markers found in any Markdown file.', file=sys.stderr)
              sys.exit(1)
          print('All inline payloads pass schema validation.')
          PYEOF

  python-tests:
    name: Python Package Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with dev dependencies
        working-directory: contracts/python
        run: pip install -e ".[dev]"

      - name: Run type checks
        working-directory: contracts/python
        run: mypy src/

      - name: Run tests with coverage
        working-directory: contracts/python
        run: pytest --cov --cov-report=term-missing -v

  markdownlint:
    name: Markdown Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install markdownlint-cli
        run: npm install -g markdownlint-cli

      - name: Lint Markdown files
        run: |
          markdownlint \
            README.md CONTRIBUTING.md CHANGELOG.md CHARTER.md \
            'docs/**/*.md' \
            'contracts/**/*.md' \
            'examples/**/*.md' \
            '.github/**/*.md'

  yamllint:
    name: YAML Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install yamllint
        run: pip install yamllint==1.35.1

      - name: Lint issue templates and workflows
        run: |
          yamllint -c .yamllint.yml \
            .github/ISSUE_TEMPLATE/ \
            .github/workflows/ \
            .yamllint.yml \
            .pre-commit-config.yaml \
            compatibility.yaml

  coverage-table:
    name: Validate Coverage Table
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check contracts/COVERAGE.md is up to date
        run: python scripts/generate_coverage_table.py --check
