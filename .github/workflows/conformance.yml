name: Conformance

# Reusable conformance suite (issues #43, #74). Sibling repos call it with:
#
#   jobs:
#     weaver-conformance:
#       uses: dgenio/weaver-spec/.github/workflows/conformance.yml@v0.6.0
#
# It is also invoked from this repo's ci.yml. See docs/CONFORMANCE.md.

on:
  workflow_call:
  workflow_dispatch:

jobs:
  conformance:
    name: Run Conformance Suite
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Mirror the package `python-tests` matrix (#152). The runner leans on
        # jsonschema / referencing / jcs / cryptography, whose behaviour can vary
        # by interpreter, so the security-relevant path is exercised on every
        # supported version rather than a single one.
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          # Matches the package `python-tests` job: 3.14 may still resolve as a
          # prerelease on the runner, so allow it rather than fail to set up.
          allow-prereleases: true

      - name: Install conformance dependencies
        run: pip install jsonschema referencing rfc3339-validator PyYAML jcs cryptography

      - name: Run conformance runner
        run: python conformance/run.py
