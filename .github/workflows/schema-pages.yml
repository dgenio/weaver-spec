name: Schema Pages

on:
  push:
    branches: ["main"]
    paths:
      - "contracts/json/**"
      - "well-known/contracts.json"
      - "scripts/build_schema_site.py"
      - ".github/workflows/schema-pages.yml"
  workflow_dispatch:

concurrency:
  group: schema-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build canonical schema site
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Build immutable schema paths
        run: python scripts/build_schema_site.py --output _site
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
          include-hidden-files: true

  deploy:
    name: Deploy canonical schema site
    runs-on: ubuntu-latest
    needs: build
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
