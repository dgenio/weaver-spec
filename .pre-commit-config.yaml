# Pre-commit hooks for weaver-spec.
#
# Mirrors the local + CI validation commands in `AGENTS.md` and
# `CONTRIBUTING.md`. Install once with:
#
#     pip install pre-commit
#     pre-commit install
#
# Hooks run in strict mode and block the commit on failure. To run all
# hooks manually against the full repo:
#
#     pre-commit run --all-files

minimum_pre_commit_version: "3.5.0"

default_language_version:
  python: python3

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: '\.md$'  # markdownlint MD009 enforces this for Markdown.
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=512"]
      - id: check-json
        files: '^(contracts/json/.*\.schema\.json|examples/sample_payloads/.*\.json|well-known/contracts\.json)$'
      - id: check-yaml
        files: '^(\.github/.*\.(ya?ml)|\.yamllint\.yml|\.pre-commit-config\.yaml)$'
      - id: check-toml
        files: '^(contracts/python/pyproject\.toml|packaging/weaver-stack/pyproject\.toml)$'

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.35.1
    hooks:
      - id: yamllint
        args: ["-c", ".yamllint.yml", "-s"]
        files: '^(\.github/ISSUE_TEMPLATE/.*\.ya?ml|\.github/workflows/.*\.ya?ml|\.yamllint\.yml|\.pre-commit-config\.yaml|compatibility\.yaml)$'

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.14.0
    hooks:
      - id: markdownlint-cli2
        files: '^(README\.md|CONTRIBUTING\.md|CHANGELOG\.md|CHARTER\.md|docs/.*\.md|contracts/.*\.md|examples/.*\.md|packaging/.*\.md|\.github/.*\.md)$'

  # Local hooks — invoke project-local validation scripts so a single
  # `pre-commit run` reproduces the CI gates.
  - repo: local
    hooks:
      - id: schema-fields-present
        name: contracts/json schemas have $id, title, description, x_weaver_stability
        description: |
          Mirrors the validate-schemas CI job. Every JSON Schema in
          contracts/json/ must declare $id, title, description, required, and a
          valid x_weaver_stability annotation (#163).
        entry: python scripts/check_schema_fields.py
        language: system
        pass_filenames: false
        files: '^contracts/json/.*\.schema\.json$'

      - id: schema-coherence
        name: schema description/constraint coherence
        description: |
          Mirrors the validate-schemas coherence check (#128): flags
          descriptions that contradict declared constraints.
        entry: python scripts/check_schema_coherence.py
        language: system
        pass_filenames: false
        files: '^contracts/json/.*\.schema\.json$'

      - id: docs-counts
        name: documentation type-counts and version references are current
        description: |
          Mirrors the validate-docs-counts CI job (#118). Fails when a doc
          states a Core/Extended type count that no longer matches the schemas.
        entry: python scripts/check_docs_counts.py
        language: system
        pass_filenames: false
        files: '^(docs/.*\.md|README\.md|contracts/.*\.md|contracts/json/.*\.schema\.json)$'

      - id: doc-links
        name: internal links, anchors, and schema $ids resolve
        description: |
          Mirrors the validate-links CI job (#119). Checks relative links,
          intra-doc anchors, and schema $id consistency with the index.
        entry: python scripts/check_doc_links.py
        language: system
        pass_filenames: false
        files: '^(.*\.md|contracts/json/.*\.schema\.json|well-known/contracts\.json)$'

      - id: adr-template
        name: ADRs conform to the template and are indexed
        description: |
          Mirrors the validate-adrs CI job (#129).
        entry: python scripts/check_adr_template.py
        language: system
        pass_filenames: false
        files: '^docs/adr/.*\.md$'

      - id: deprecation-register
        name: deprecation register policy
        description: |
          Mirrors the validate-deprecations CI job (#153): enforces the
          one-MAJOR retention rule and schema-field register coverage.
        entry: python scripts/check_deprecations.py
        language: system
        pass_filenames: false
        files: '^(docs/DEPRECATIONS\.md|contracts/json/.*\.schema\.json)$'

      - id: contracts-index-fresh
        name: well-known/contracts.json is up to date
        description: |
          Mirrors the validate-contracts-index CI job. Fails when a schema
          is edited without running scripts/generate_contracts_index.py.
        entry: python scripts/generate_contracts_index.py --check
        language: system
        pass_filenames: false
        files: '^(contracts/json/.*\.schema\.json|well-known/contracts\.json|scripts/generate_contracts_index\.py|contracts/python/src/weaver_contracts/version\.py)$'

      - id: version-consistency
        name: contract version string is consistent everywhere
        description: |
          Mirrors the validate-version-consistency CI job. Fails when any
          tracked file's version string drifts from CONTRACT_VERSION in
          version.py (the single source of truth).
        entry: python scripts/check_version_consistency.py
        language: system
        pass_filenames: false
        files: '^(contracts/python/src/weaver_contracts/version\.py|contracts/python/pyproject\.toml|well-known/contracts\.json|CHANGELOG\.md|README\.md|docs/VERSIONING\.md|compatibility\.yaml|CITATION\.cff|scripts/check_version_consistency\.py)$'

      - id: weaver-contracts-tests
        name: weaver_contracts pytest (changed Python files only)
        description: |
          Runs the contracts/python pytest suite. Triggered only when
          Python sources, tests, schemas, or sample payloads change.
        entry: |-
          python -c "import subprocess,sys; sys.exit(subprocess.run([sys.executable,'-m','pytest','-q'],cwd='contracts/python').returncode)"
        language: system
        pass_filenames: false
        files: '^(contracts/python/.*\.(py|toml)|contracts/json/.*\.schema\.json|examples/sample_payloads/.*\.json)$'
        stages: [pre-push]

      - id: compatibility-manifest
        name: compatibility.yaml structure + matrix consistency
        description: |
          Mirrors the validate-compatibility CI job locally: runs the
          validator self-test and validates compatibility.yaml against
          docs/VERSIONING.md. PyYAML is installed in the hook's isolated env
          so scripts/validate_compatibility.py stays stdlib-only.
        entry: |-
          python -c "
          import sys; sys.path.insert(0, 'scripts')
          from pathlib import Path
          import yaml
          from validate_compatibility import self_test, validate
          manifest = yaml.safe_load(Path('compatibility.yaml').read_text(encoding='utf-8'))
          errors = ['self-test: ' + p for p in self_test()] + validate(manifest, Path('docs/VERSIONING.md').read_text(encoding='utf-8'))
          for e in errors:
              print('FAIL:', e, file=sys.stderr)
          sys.exit(1 if errors else 0)
          "
        language: python
        additional_dependencies: ["pyyaml"]
        pass_filenames: false
        files: '^(compatibility\.yaml|docs/VERSIONING\.md|scripts/validate_compatibility\.py)$'

      - id: meta-package
        name: weaver-stack meta-package consistent with compatibility.yaml
        description: |
          Mirrors the validate-meta-package CI job locally: runs the validator
          self-test and checks the meta-package pins against compatibility.yaml.
          PyYAML + tomli are installed in the hook's isolated env so
          scripts/validate_meta_package.py stays stdlib-only.
        entry: |-
          python -c "
          import sys; sys.path.insert(0, 'scripts')
          from pathlib import Path
          import yaml
          try:
              import tomllib
          except ModuleNotFoundError:
              import tomli as tomllib
          from validate_meta_package import self_test, validate
          manifest = yaml.safe_load(Path('compatibility.yaml').read_text(encoding='utf-8'))
          pyproject = tomllib.loads(Path('packaging/weaver-stack/pyproject.toml').read_text(encoding='utf-8'))
          errors = ['self-test: ' + p for p in self_test()] + validate(manifest, pyproject)
          for e in errors:
              print('FAIL:', e, file=sys.stderr)
          sys.exit(1 if errors else 0)
          "
        language: python
        additional_dependencies: ["pyyaml", "tomli"]
        pass_filenames: false
        files: '^(compatibility\.yaml|packaging/weaver-stack/pyproject\.toml|scripts/validate_meta_package\.py)$'
