[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "weaver_contracts"
version = "0.8.0"
description = "Minimal Python contracts for the Weaver Stack (contextweaver, agent-kernel, ChainWeaver)"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
# Intentionally empty: weaver_contracts is stdlib-only at runtime. Per the
# dependency policy in CONTRIBUTING.md ("Library dependency constraints"), any
# future runtime dependency must use a lower bound only (>=), with no exact pin
# (==) and no speculative upper-bound cap.
dependencies = []
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
]

# Local contributor/CI tooling only. PEP 735 dependency groups are not emitted
# as wheel optional-dependency metadata, keeping this runtime package truly
# stdlib-only for downstream users.
[dependency-groups]
dev = [
    "pytest>=7.4",
    "jsonschema>=4.18",
    "referencing>=0.30",
    "mypy>=1.0",
    "pytest-cov>=4.0",
    "pre-commit>=3.5",
    "yamllint>=1.35",
    "tomli>=2.0; python_version < '3.11'",
    "PyYAML>=6.0",
    "jcs>=0.2.1",
    "cryptography>=41.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["weaver_contracts"]

[tool.coverage.report]
# Raised to 80% when Extended contract tests landed (#17, PR #34).
fail_under = 80
show_missing = true
