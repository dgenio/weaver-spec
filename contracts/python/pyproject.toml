[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "weaver_contracts"
version = "0.6.0"
description = "Minimal Python contracts for the Weaver Stack (contextweaver, agent-kernel, ChainWeaver)"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "jsonschema>=4.18",
    "referencing>=0.30",
    "mypy>=1.0",
    "pytest-cov>=4.0",
    "pre-commit>=3.5",
    "yamllint>=1.35",
    # Conformance runner (conformance/run.py) extras — build-time/CI only,
    # never imported by weaver_contracts.
    "PyYAML>=6.0",
    "jcs>=0.2.1",
    "cryptography>=41.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["weaver_contracts"]

[tool.coverage.report]
# Raised to 80% when Extended contract tests landed (#17, PR #34).
fail_under = 80
show_missing = true
